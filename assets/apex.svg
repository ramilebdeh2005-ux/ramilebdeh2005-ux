  <text class="sans" x="48" y="140" font-size="60" font-weight="800" letter-spacing="3" fill="#F8FAFC">APEX</text>
  <text class="sans" x="48" y="184" font-size="26" font-weight="500" fill="#CBD5E1">Autonomous Process &amp; Enterprise X-Framework</text>
  <text class="sans" x="48" y="222" font-size="18" fill="#94A3B8">Specialized AI executives reason about one decision — verified, governed, and auditable end to end.</text>

