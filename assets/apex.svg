<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d">
  <title id="t">APEX — Autonomous Process &amp; Enterprise X-Framework</title>
  <desc id="d">Flagship multi-agent decision intelligence platform, completed, private case study. A decision request goes to the CEO executive orchestrator, which coordinates specialized executive agents (CFO, CMO, CRO, CLO, CHRO, CTO), organizational memory (CDO) and governance (BRD). Their output becomes evidence and claims, is checked by QA verification, becomes decision intelligence, and reaches a human decision maker.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="75%"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".14"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#4338CA" stop-opacity=".4"/><stop offset="1" stop-color="#7C3AED" stop-opacity=".4"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A78BFA"/></marker>
    <clipPath id="c"><rect width="1200" height="840" rx="20"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
      .box{fill:#0E1124;stroke:#2E2A5C;stroke-width:1.2}
      .chip{fill:#141834;stroke:#312E81;stroke-width:1}
      .cap{fill:#A78BFA;font-size:12px;letter-spacing:2.5px}
      .lbl{fill:#F1F5F9;font-weight:700}
      .code{fill:#F1F5F9;font-size:18px;font-weight:800;letter-spacing:1px}
      .big{fill:#F1F5F9;font-size:30px;font-weight:800;letter-spacing:2px}
      .sub{fill:#64748B;font-size:13px}
      .wire{stroke:#A78BFA;stroke-width:1.6;fill:none;stroke-opacity:.75}
      .flow{stroke-dasharray:5 7;animation:f 3s linear infinite}
      .glow{opacity:0;animation:gl 10s linear infinite}@keyframes gl{0%{opacity:0}2%{opacity:1}9%{opacity:0}100%{opacity:0}}
      @keyframes f{to{stroke-dashoffset:-48}}
      @media (prefers-reduced-motion:reduce){.flow,.glow{animation:none}.glow{opacity:0}}
    </style>
  </defs>
