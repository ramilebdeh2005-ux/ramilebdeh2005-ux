<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Rami Khaldon Abu Lebdeh</title>
  <desc id="d">Data Science and Artificial Intelligence. AI Engineering, Agentic AI, Multi-Agent Systems, Data Intelligence. Building intelligent systems from AI agents, data, and real-world problems.</desc>
  <defs>
    <radialGradient id="glowA" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="100%" cy="100%" r="60%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity=".55"/>
    </pattern>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.6;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="type"><rect x="190" y="340" width="0" height="44"><animate attributeName="width" from="0" to="830" dur="3.2s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .6 1"/></rect></clipPath>
    <clipPath id="card"><rect width="1200" height="440" rx="20"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .caret{animation:blink 1.1s steps(1) infinite}
      .rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
      .pul{animation:pulse 3.2s ease-in-out infinite}
      @keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
      .flow{stroke-dasharray:4 10;animation:flow 6s linear infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes flow{to{stroke-dashoffset:-140}}
      @media (prefers-reduced-motion:reduce){.pulse,.caret,.flow,.rise,.pul{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="#080D1A"/>
    <rect width="1200" height="440" fill="url(#dots)"/>
    <rect width="1200" height="440" fill="url(#glowA)"/>
    <rect width="1200" height="440" fill="url(#glowB)"/>
    <g stroke="#22D3EE" stroke-opacity=".22" stroke-width="1.2" fill="none">
      <path class="flow" d="M60 120 L150 80 L220 150 L130 210 Z M150 80 L130 210 M220 150 L190 280 L90 300 L130 210"/>
    </g>
    <g fill="#22D3EE" fill-opacity=".45">
      <circle class="pul" style="animation-delay:0.55s" cx="60" cy="120" r="4"/><circle class="pul" style="animation-delay:1.10s" cx="150" cy="80" r="5"/><circle class="pul" style="animation-delay:1.65s" cx="220" cy="150" r="4"/>
      <circle class="pul" style="animation-delay:2.20s" cx="130" cy="210" r="6"/><circle class="pul" style="animation-delay:2.75s" cx="190" cy="280" r="4"/><circle class="pul" style="animation-delay:0.10s" cx="90" cy="300" r="3.5"/>
    </g>
    <g stroke="#A78BFA" stroke-opacity=".22" stroke-width="1.2" fill="none">
      <path class="flow" d="M1140 110 L1050 150 L1000 240 L1080 300 L1150 230 Z M1050 150 L1080 300 M1150 230 L1050 150"/>
    </g>
    <g fill="#A78BFA" fill-opacity=".45">
      <circle class="pul" style="animation-delay:0.65s" cx="1140" cy="110" r="4"/><circle class="pul" style="animation-delay:1.20s" cx="1050" cy="150" r="6"/><circle class="pul" style="animation-delay:1.75s" cx="1000" cy="240" r="4"/>
      <circle class="pul" style="animation-delay:2.30s" cx="1080" cy="300" r="5"/><circle class="pul" style="animation-delay:2.85s" cx="1150" cy="230" r="3.5"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="20" fill="none" stroke="#1E293B"/>

  <g transform="translate(600 78)">
    <rect x="-176" y="-19" width="352" height="38" rx="19" fill="#0F172A" stroke="#1E3A5F"/>
    <circle class="pulse" cx="-150" cy="0" r="5" fill="#22D3EE"/>
    <text class="mono" x="10" y="5" text-anchor="middle" font-size="14" letter-spacing="3" fill="#94A3B8">AI ENGINEERING PORTFOLIO</text>
  </g>

  <text class="sans rise" x="600" y="186" text-anchor="middle" font-size="58" font-weight="800" letter-spacing="2" fill="#F8FAFC">RAMI KHALDON ABU LEBDEH</text>
  <text class="sans rise d1" x="600" y="238" text-anchor="middle" font-size="26" font-weight="500" fill="#CBD5E1">Data Science &amp; Artificial Intelligence</text>
  <text class="sans rise d2" x="600" y="290" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="url(#accent)">AI ENGINEERING  ·  AGENTIC AI  ·  MULTI-AGENT SYSTEMS  ·  DATA INTELLIGENCE</text>
  <text class="sans rise d2" x="600" y="290" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="url(#shine)">AI ENGINEERING  ·  AGENTIC AI  ·  MULTI-AGENT SYSTEMS  ·  DATA INTELLIGENCE</text>

  <rect x="350" y="324" width="500" height="1.5" fill="url(#rule)"/>

  <text class="mono" clip-path="url(#type)" x="600" y="370" text-anchor="middle" font-size="17" fill="#94A3B8"><tspan fill="#22D3EE">&gt;</tspan> building intelligent systems from AI agents, data, and real-world problems<tspan class="caret" fill="#22D3EE">_</tspan></text>

  <text class="mono" x="40" y="414" font-size="12" letter-spacing="2" fill="#475569">AMMAN, JORDAN</text>
  <text class="mono" x="1160" y="414" text-anchor="end" font-size="12" letter-spacing="2" fill="#475569">B.SC. DATA SCIENCE &amp; AI · 2027</text>
</svg>
