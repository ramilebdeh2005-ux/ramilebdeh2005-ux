<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Bellabeat Fitness Data Analysis</title>
  <desc id="d">Data analytics and business intelligence project, public repository. Workflow: raw data, data cleaning, exploratory analysis, behavioral patterns, visualization, business insights.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#1E40AF" stop-opacity=".35"/><stop offset="1" stop-color="#2563EB" stop-opacity=".35"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#60A5FA"/></marker>
    <clipPath id="c"><rect width="1200" height="380" rx="20"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
      .lbl{fill:#F1F5F9;font-weight:700}
      .sub{fill:#64748B;font-size:13px}
      .flow{stroke-dasharray:5 7;animation:f 3s linear infinite}
      .glow{opacity:0;animation:gl8 8s linear infinite}@keyframes gl8{0%{opacity:0}3%{opacity:1}14%{opacity:0}100%{opacity:0}}
      @keyframes f{to{stroke-dashoffset:-48}}
      @media (prefers-reduced-motion:reduce){.flow,.glow{animation:none}.glow{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="380" fill="#080D1A"/>
    <rect width="1200" height="4" fill="url(#bar)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="20" fill="none" stroke="#1E293B"/>

  <g class="mono" font-size="13" letter-spacing="2.5">
    <rect x="48" y="38" width="430" height="32" rx="16" fill="#0C1A33" stroke="#1E3A8A"/>
    <text x="263" y="59" text-anchor="middle" fill="#93C5FD">DATA ANALYTICS · BUSINESS INTELLIGENCE</text>
    <rect x="924" y="38" width="228" height="32" rx="16" fill="#0C1A33" stroke="#1E40AF"/>
    <circle cx="948" cy="54" r="5" fill="#60A5FA"/>
    <text x="1046" y="59" text-anchor="middle" fill="#93C5FD">PUBLIC REPOSITORY</text>
  </g>

  <text class="sans" x="48" y="130" font-size="40" font-weight="800" letter-spacing="1" fill="#F8FAFC">Bellabeat Fitness Data Analysis</text>
  <text class="sans" x="48" y="168" font-size="18" fill="#94A3B8">Wearable activity &amp; sleep data → behavioral patterns → data-driven marketing recommendations.</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.78;0.80;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    <circle r="12" fill="#93C5FD" fill-opacity=".18"/><circle r="4" fill="#93C5FD"/>
    <animateMotion path="M155 242 H1045" keyPoints="0;1;1" keyTimes="0;0.80;1" calcMode="linear" dur="8s" begin="0s" repeatCount="indefinite"/>
  </g>

  <g class="sans">
    <rect x="73" y="204" width="164" height="76" rx="12" fill="#0C1426" stroke="#1E3A8A"/>
    <text class="lbl" x="91" y="236" font-size="16">RAW DATA</text><text class="sub" x="91" y="258">Fitbit · Kaggle</text>
    <rect x="251" y="204" width="164" height="76" rx="12" fill="#0C1426" stroke="#1E3A8A"/>
    <text class="lbl" x="269" y="236" font-size="16">CLEANING</text><text class="sub" x="269" y="258">dedupe · types · merge</text>
    <rect x="429" y="204" width="164" height="76" rx="12" fill="#0C1426" stroke="#1E3A8A"/>
    <text class="lbl" x="447" y="236" font-size="16">EXPLORATORY</text><text class="sub" x="447" y="258">activity · sleep EDA</text>
    <rect x="607" y="204" width="164" height="76" rx="12" fill="#0C1426" stroke="#1E3A8A"/>
    <text class="lbl" x="625" y="236" font-size="16">PATTERNS</text><text class="sub" x="625" y="258">user-level behavior</text>
    <rect x="785" y="204" width="164" height="76" rx="12" fill="#0C1426" stroke="#1E3A8A"/>
    <text class="lbl" x="803" y="236" font-size="16">VISUALIZATION</text><text class="sub" x="803" y="258">Python · Tableau</text>
    <rect x="963" y="204" width="164" height="76" rx="12" fill="url(#hl)" stroke="#60A5FA" stroke-width="1.4"/>
    <text class="lbl" x="981" y="236" font-size="16">INSIGHTS</text><text class="sub" x="981" y="258" style="fill:#93C5FD">recommendations</text>
  </g>
  <g stroke="#60A5FA" stroke-width="1.5" fill="none" stroke-opacity=".8" marker-end="url(#ar)">
    <path d="M238 242 H248"/><path d="M416 242 H426"/><path d="M594 242 H604"/><path d="M772 242 H782"/><path d="M950 242 H960"/>
  </g>

  <rect class="glow" style="animation-delay:-0.20s" x="73" y="204" width="164" height="76" rx="12" fill="none" stroke="#60A5FA" stroke-width="2.2"/>
  <rect class="glow" style="animation-delay:1.08s" x="251" y="204" width="164" height="76" rx="12" fill="none" stroke="#60A5FA" stroke-width="2.2"/>
  <rect class="glow" style="animation-delay:2.36s" x="429" y="204" width="164" height="76" rx="12" fill="none" stroke="#60A5FA" stroke-width="2.2"/>
  <rect class="glow" style="animation-delay:3.64s" x="607" y="204" width="164" height="76" rx="12" fill="none" stroke="#60A5FA" stroke-width="2.2"/>
  <rect class="glow" style="animation-delay:4.92s" x="785" y="204" width="164" height="76" rx="12" fill="none" stroke="#60A5FA" stroke-width="2.2"/>
  <rect class="glow" style="animation-delay:6.20s" x="963" y="204" width="164" height="76" rx="12" fill="none" stroke="#60A5FA" stroke-width="2.2"/>

  <line x1="48" y1="312" x2="1152" y2="312" stroke="#1E293B"/>
  <text class="mono" x="48" y="348" font-size="12" letter-spacing="2.5" fill="#475569">STACK</text>
  <text class="mono" x="118" y="348" font-size="15" fill="#94A3B8">Python · Pandas · NumPy · Matplotlib · Seaborn · Tableau Public · Excel</text>
</svg>