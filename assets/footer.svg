<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="From data to decisions: building intelligent systems.">
  <defs>
    <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".3" stop-color="#22D3EE"/><stop offset=".7" stop-color="#8B5CF6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#6366F1" stop-opacity=".16"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="1200" height="170" rx="20"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
      .pul{animation:p 3s ease-in-out infinite}@keyframes p{0%,100%{opacity:.9}50%{opacity:.3}}
      @media (prefers-reduced-motion:reduce){.pul{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#c)"><rect width="1200" height="170" fill="#080D1A"/><rect width="1200" height="170" fill="url(#glow)"/></g>
  <rect x=".5" y=".5" width="1199" height="169" rx="20" fill="none" stroke="#1E293B"/>
  <rect x="200" y="58" width="800" height="1.5" fill="url(#l)"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.6;.65;1" dur="7s" repeatCount="indefinite"/>
    <circle r="10" fill="#A5F3FC" fill-opacity=".2"/><circle r="3" fill="#E0F2FE"/>
    <animateMotion path="M260 58.75 H940" keyPoints="0;1;1" keyTimes="0;.65;1" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1" dur="7s" repeatCount="indefinite"/>
  </g>
  <circle class="pul" cx="600" cy="58.75" r="4" fill="#818CF8"/>
  <text class="sans" x="600" y="104" text-anchor="middle" font-size="24" font-weight="700" fill="#F1F5F9">From data to decisions.</text>
  <text class="mono" x="600" y="138" text-anchor="middle" font-size="13" letter-spacing="3" fill="#64748B">BUILDING INTELLIGENT SYSTEMS · AMMAN, JORDAN</text>
</svg>
